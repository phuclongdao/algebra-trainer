<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra Trainer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Khung chung cho các màn hình (Card) */
        .screen-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 100%;
            max-width: 420px;
        }

        /* Lớp quản lý trạng thái Ẩn/Hiện màn hình */
        .hidden {
            display: none !important;
        }

        /* Tiêu đề và văn bản */
        .game-title {
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            color: #1e293b;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .game-subtitle {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Nút bấm chung */
        .btn {
            background-color: #2563eb;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            margin-bottom: 12px;
        }

        .btn:hover {
            background-color: #1d4ed8;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Nút phụ / Nút quay lại */
        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
            box-shadow: none;
        }
        .btn-secondary:hover {
            background-color: #cbd5e1;
            box-shadow: none;
        }

        /* Khu vực hiển thị màn hình game (tạm thời) */
        .game-area {
            font-size: 1.2rem;
            color: #0f172a;
            margin: 20px 0;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH 1: CHÀO MỪNG -->
    <div id="welcome-screen" class="screen-card">
        <h1 class="game-title">Algebra Trainer</h1>
        <p class="game-subtitle">Luyện tập biến đổi đại số lớp 6-7</p>
        <button class="btn" onclick="goToScreen('mode-screen')">Bắt Đầu Chơi</button>
    </div>

    <!-- MÀN HÌNH 2: CHỌN CHẾ ĐỘ CHƠI -->
    <div id="mode-screen" class="screen-card hidden">
        <h2 class="game-title" style="font-size: 1.5rem;">Chọn Chế Độ</h2>
        <p class="game-subtitle">Chọn dạng bài tập bạn muốn luyện tập hôm nay:</p>
        
        <!-- Truyền tên chế độ vào hàm startGame(modeName) -->
        <button class="btn" onclick="startGame('Chuyển vế & Rút gọn cơ bản')">1. Chuyển vế & Rút gọn cơ bản</button>
        <button class="btn" onclick="startGame('Khai triển & Phá ngoặc')">2. Khai triển & Phá ngoặc</button>
        
        <button class="btn btn-secondary" onclick="goToScreen('welcome-screen')">Quay lại</button>
    </div>

    <!-- MÀN HÌNH 3: KHUNG CHƠI GAME CHUNG (DÙNG CHO MỌI CHẾ ĐỘ) -->
    <div id="game-screen" class="screen-card hidden">
        <!-- Tiêu đề này sẽ đổi linh hoạt theo chế độ người dùng bấm -->
        <h2 id="game-mode-title" class="game-title" style="font-size: 1.5rem;">Đang Luyện Tập</h2>
        
        <div class="game-area">
            Ví dụ: <span id="sample-expression">$4n - 1 - t^2 - n - 4 = 0$</span><br>
            <span style="font-size: 0.9rem; color: #64748b;">(Khu vực hiển thị câu hỏi tương ứng với chế độ)</span>
        </div>
        
        <button class="btn btn-secondary" onclick="goToScreen('mode-screen')">Chọn chế độ khác</button>
    </div>

    <script>
        // Hàm chuyển đổi màn hình chung
        function goToScreen(screenId) {
            const screens = document.querySelectorAll('.screen-card');
            screens.forEach(screen => {
                screen.classList.add('hidden');
            });

            const targetScreen = document.getElementById(screenId);
            if (targetScreen) {
                targetScreen.classList.remove('hidden');
            }
        }

        // Hàm riêng để khởi tạo khi bấm vào một chế độ chơi bất kỳ
        function startGame(modeName) {
            // 1. Thay đổi tiêu đề màn hình game theo đúng chế độ được chọn
            document.getElementById('game-mode-title').innerText = modeName;

            // 2. (Tùy chọn) Sau này bạn có thể viết logic nạp câu hỏi khác nhau ở đây dựa vào biến `modeName`
            if (modeName === 'Khai triển & Phá ngoặc') {
                document.getElementById('sample-expression').innerText = "-(2x + 3) + 4(x - 1) = 0";
            } else {
                document.getElementById('sample-expression').innerText = "4n - 1 - t^2 - n - 4 = 0";
            }

            // 3. Chuyển sang màn hình chơi game
            goToScreen('game-screen');
        }
    </script>

</body>
</html>
